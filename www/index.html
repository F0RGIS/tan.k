<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
  <meta name="description" content="TAN.K - a Battle City (NES) tribute. Defend the eagle, destroy 20 enemy tanks per stage.">
  <title>TAN.K</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage">
    <canvas id="game" aria-label="TAN.K game screen"></canvas>
  </main>

  <div id="touch-controls" aria-hidden="true">
    <div id="dpad"><div id="dpad-arrows"></div><div id="dpad-knob"></div></div>
    <div id="menu-buttons">
      <button id="btn-pause" type="button">II</button>
      <button id="btn-start" type="button">START</button>
    </div>
    <button id="btn-fire" type="button">FIRE</button>
  </div>

  <script src="js/font.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/game.js"></script>
  <script>
    // Offline support when served over http(s).
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloading) return;
        reloading = true;
        location.reload();
      });
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
    }
  </script>
</body>
</html>
