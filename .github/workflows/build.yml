name: Build apps

# Builds the Windows .exe (installer + portable) and an Android debug .apk.
# Run manually from the Actions tab, or push a tag like v1.0.0.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: TAN.K-windows
          path: dist/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          # v3 defaulted to the removed `tools` package and died on sdkmanager.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npx cap add android
      - name: Generate launcher icons
        run: npx capacitor-assets generate --android
        continue-on-error: true
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TAN.K-android
          path: android/app/build/outputs/apk/debug/*.apk
